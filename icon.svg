<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="bar-1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="bar-2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="bar-3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Trend Line Gradient -->
    <linearGradient id="line-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Shadow Filter for Glow Effect -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.3" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#bg-gradient)" />
  
  <!-- Outer decorative thin border for premium look -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#3b82f6" stroke-opacity="0.15" stroke-width="4" />

  <!-- Inner content group with drop shadow -->
  <g filter="url(#shadow)">
    <!-- Column 1 (Left: Expenses/Base) -->
    <rect x="135" y="260" width="54" height="140" rx="18" fill="url(#bar-1)" />

    <!-- Column 2 (Middle: Balance/Stable) -->
    <rect x="229" y="170" width="54" height="230" rx="18" fill="url(#bar-2)" />

    <!-- Column 3 (Right: Profits/High) -->
    <rect x="323" y="210" width="54" height="190" rx="18" fill="url(#bar-3)" />

    <!-- Trend Arrow Line (Curved path showing growth) -->
    <path d="M 90,360 C 160,260 250,110 390,140" 
          fill="none" 
          stroke="url(#line-grad)" 
          stroke-width="22" 
          stroke-linecap="round" 
          filter="url(#glow)" />
          
    <!-- Arrow Head -->
    <path d="M 370,105 L 420,135 L 390,185" 
          fill="none" 
          stroke="url(#line-grad)" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
